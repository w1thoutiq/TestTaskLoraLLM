seed: 42

paths:
  data: data
  adapter: models/lora-adapter
  checkpoints: models/checkpoints
  artifacts: artifacts

model:
  id: Qwen/Qwen2.5-3B-Instruct
  bnb:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: float16
    bnb_4bit_use_double_quant: true

data:
  test_file: test_inputs.jsonl
  val_per_type: 5  # на каждый стиль; в обучение не попадают

# пусто → Qwen подставит своё «You are Qwen…»
system_prompt: Ты редактор новостного Telegram-канала. Переписывай новость в стиле канала. Не меняй и не выдумывай цифры, даты, имена и факты.

# instruction — дословно как в train-данных: по этому тексту адаптер выбирает стиль
styles:
  1:
    train_file: train_type1.jsonl
    instruction: Перепиши новостной текст в стиле Telegram-канала @banki_oil.
    signature: "@banki_oil"
  2:
    train_file: train_type2.jsonl
    instruction: Перепиши новостной текст в стиле Telegram-канала @moscowach (городской новостной формат с эмодзи в начале, жирным заголовком и короткими абзацами).

train:
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    task_type: CAUSAL_LM
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  sft:
    # 40 примеров / (4 × 2) = 5 шагов на эпоху, 25 всего
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 2
    learning_rate: 2.0e-4
    num_train_epochs: 5  # при 2 адаптер недоучен: без примеров не держит стиль @moscowach
    lr_scheduler_type: cosine
    warmup_steps: 0  # при 25 шагах прогрев съедает целый шаг с lr=0
    fp16: true
    bf16: false
    gradient_checkpointing: true
    optim: paged_adamw_8bit
    max_length: 1024
    logging_steps: 1
    save_strategy: "no"
    eval_strategy: epoch  # если eval loss растёт — переобучились
    report_to: none

test:
  fewshot_k: 3
  batch_size: 8
  output_variant: lora  # base_prompt | base_fewshot | lora | lora_fewshot
  gen:
    max_new_tokens: 400
    do_sample: true
    temperature: 0.05
    top_p: 0.9
    repetition_penalty: 1.05

# читает только inference.sh
serve:
  adapter_name: style  # это же имя клиент передаёт в поле model
  host: 0.0.0.0
  port: 8000
  max_concurrent: 15
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  max_lora_rank: 16
  max_loras: 1
  dtype: float16
